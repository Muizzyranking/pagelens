<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PageLens</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <div class="popup" id="app">

    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3C7.03 3 3 7.03 3 12s4.03 9 9 9 9-4.03 9-9-4.03-9-9-9z" fill="currentColor" opacity="0.15"/>
          <circle cx="12" cy="12" r="3" fill="currentColor"/>
          <path d="M12 3v3M12 18v3M3 12h3M18 12h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M6.34 6.34l2.12 2.12M15.54 15.54l2.12 2.12M6.34 17.66l2.12-2.12M15.54 8.46l2.12-2.12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
        </svg>
        <span class="logo-text">PageLens</span>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="settingsBtn" aria-label="Open settings" title="Settings">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M8.5 2h3l.5 2a5.5 5.5 0 011.4.8l1.9-.8 2.1 2.1-.8 1.9A5.5 5.5 0 0118 9.5v1a5.5 5.5 0 01-.4 1.5l.8 1.9-2.1 2.1-1.9-.8a5.5 5.5 0 01-1.4.8l-.5 2h-3l-.5-2a5.5 5.5 0 01-1.4-.8l-1.9.8-2.1-2.1.8-1.9A5.5 5.5 0 012 10.5v-1a5.5 5.5 0 01.4-1.5l-.8-1.9 2.1-2.1 1.9.8A5.5 5.5 0 018 4l.5-2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.4"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Page info strip -->
    <div class="page-info" id="pageInfo">
      <div class="page-title-wrap">
        <span class="page-label">Current page</span>
        <p class="page-title" id="pageTitle">Loading…</p>
      </div>
      <div class="cache-badge" id="cacheBadge" hidden>
        <svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M6 1v5l3 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="6" cy="6" r="5" stroke="currentColor" stroke-width="1.2"/></svg>
        Cached
      </div>
    </div>

    <!-- Main content area -->
    <main class="content" id="contentArea">

      <!-- Idle state -->
      <div class="state state--idle" id="stateIdle">
        <div class="idle-art" aria-hidden="true">
          <div class="idle-ring idle-ring--1"></div>
          <div class="idle-ring idle-ring--2"></div>
          <div class="idle-ring idle-ring--3"></div>
          <svg class="idle-icon" viewBox="0 0 48 48" fill="none">
            <rect x="8" y="12" width="32" height="4" rx="2" fill="currentColor" opacity="0.3"/>
            <rect x="8" y="20" width="28" height="4" rx="2" fill="currentColor" opacity="0.5"/>
            <rect x="8" y="28" width="24" height="4" rx="2" fill="currentColor" opacity="0.3"/>
            <rect x="8" y="36" width="18" height="4" rx="2" fill="currentColor" opacity="0.2"/>
          </svg>
        </div>
        <p class="idle-hint">Get a structured summary of<br/>any article in seconds.</p>
      </div>

      <!-- Loading state -->
      <div class="state state--loading" id="stateLoading" hidden>
        <div class="spinner" aria-hidden="true">
          <div class="spinner-ring"></div>
          <svg class="spinner-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="3" fill="currentColor"/>
            <path d="M12 3v3M12 18v3M3 12h3M18 12h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
          </svg>
        </div>
        <p class="loading-label" id="loadingLabel">Reading page…</p>
      </div>

      <!-- Error state -->
      <div class="state state--error" id="stateError" hidden>
        <div class="error-icon" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
            <path d="M16 9v8M16 21v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <p class="error-message" id="errorMessage">Something went wrong.</p>
        <button class="btn btn--ghost btn--sm" id="retryBtn">Try again</button>
      </div>

      <!-- Summary state -->
      <div class="state state--summary" id="stateSummary" hidden>

        <!-- Stats row -->
        <div class="stats-row">
          <div class="stat">
            <span class="stat-value" id="statReadTime">—</span>
            <span class="stat-label">min read</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat">
            <span class="stat-value" id="statWordCount">—</span>
            <span class="stat-label">words</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat">
            <span class="stat-value" id="statBullets">—</span>
            <span class="stat-label">points</span>
          </div>
        </div>

        <!-- Summary bullets -->
        <section class="summary-section" aria-label="Summary">
          <div class="section-header">
            <span class="section-title">Summary</span>
          </div>
          <ul class="bullet-list" id="summaryList" role="list"></ul>
        </section>

        <!-- Key insights -->
        <section class="summary-section" aria-label="Key insights" id="insightsSection">
          <div class="section-header">
            <span class="section-title">Key Insights</span>
          </div>
          <ul class="insight-list" id="insightList" role="list"></ul>
        </section>

        <!-- Highlight + Sidebar action row -->
        <div class="highlight-action-row" id="highlightActionRow" hidden>
          <button class="btn btn--highlight" id="highlightBtn">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M3 13l2-5 6-6 3 3-6 6-5 2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
              <path d="M9 4l3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            Highlight
          </button>
          <button class="btn btn--sidebar" id="sidebarBtn">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <rect x="9" y="2" width="5" height="12" rx="1" stroke="currentColor" stroke-width="1.3"/>
              <path d="M2 4h5M2 7h4M2 10h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            Sidebar
          </button>
        </div>
        <!-- Highlight fail message -->
        <div class="highlight-fail-msg" id="highlightFailMsg" hidden>
          No matching phrases found on this page.
        </div>

      </div>
    </main>

    <!-- Footer actions -->
    <footer class="footer">
      <button class="btn btn--primary" id="summarizeBtn">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2 4h12M2 8h9M2 12h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span id="summarizeBtnLabel">Summarize Page</span>
      </button>
      <div class="footer-secondary">
        <button class="btn btn--ghost btn--sm" id="copyBtn" hidden>
          <svg viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <rect x="4" y="4" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
            <path d="M2 10V2h8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Copy
        </button>
        <button class="btn btn--ghost btn--sm btn--danger" id="clearBtn" hidden>
          <svg viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M2 4h10M5 4V2.5a.5.5 0 01.5-.5h3a.5.5 0 01.5.5V4M11 4l-.8 7.5a.5.5 0 01-.5.5H4.3a.5.5 0 01-.5-.5L3 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Clear
        </button>
      </div>
    </footer>

  </div>

  <script src="popup.js"></script>
</body>
</html>
